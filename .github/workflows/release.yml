# Attaches the Claude Desktop extension (noresponse.mcpb) to the GitHub
# release of each version tag. The tags are pushed by the NoResponse release
# workflow, which also publishes @noresponse/mcp to npm.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build the desktop extension
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild bun
          npm run mcpb:build
          mv mcp-server.mcpb noresponse.mcpb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="## $version" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          {
            echo
            echo "Install the desktop extension by opening noresponse.mcpb with Claude Desktop, or run \`npx -y @noresponse/mcp@$version start\` with NORESPONSE_API_KEY set."
          } >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" noresponse.mcpb --clobber
          else
            gh release create "$TAG" noresponse.mcpb --verify-tag --title "$TAG" --notes-file notes.md
          fi
